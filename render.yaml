services:
  # 1. Express Backend Web Service
  - type: web
    name: eventnest-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set DATABASE_URL in Render Dashboard Environment variables to your PostgreSQL instance (e.g., Neon or Render PostgreSQL)

  # 2. React Vite Frontend Static Site
  - type: web
    name: eventnest-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eventnest-api.onrender.com/api
